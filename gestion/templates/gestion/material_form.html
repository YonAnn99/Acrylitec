{% extends 'gestion/base.html' %}

{% block title %}Nuevo material — Acrylitec{% endblock %}

{% block content %}
<header class="page-header">
    <div class="page-heading">
        <a class="page-eyebrow" href="{% url 'lista_materiales' %}"><i class="bi bi-chevron-left"></i> Materiales</a>
        <h1 class="page-title">Nuevo material</h1>
    </div>
</header>

<section class="card" style="max-width: 640px;">
    <div class="card-body">
        <form method="POST" style="display: flex; flex-direction: column; gap: 16px;">
            {% csrf_token %}
            <div>
                <label class="form-label" for="matDesc">Descripción del acrílico</label>
                <input type="text" id="matDesc" name="descripcion" class="form-control" placeholder="Ej. Acrílico cristal 3 mm" required autofocus>
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px;">
                <div>
                    <label class="form-label" for="matLargo">Largo (cm)</label>
                    <input type="number" id="matLargo" step="0.01" name="largo" class="form-control" required>
                </div>
                <div>
                    <label class="form-label" for="matAncho">Ancho (cm)</label>
                    <input type="number" id="matAncho" step="0.01" name="ancho" class="form-control" required>
                </div>
                <div>
                    <label class="form-label" for="matStock">Stock</label>
                    <input type="number" id="matStock" name="stock" class="form-control" required>
                </div>
                <div>
                    <label class="form-label" for="matMin">Stock mínimo</label>
                    <input type="number" id="matMin" name="stock_minimo" class="form-control" required>
                </div>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;">
                <a href="{% url 'lista_materiales' %}" class="btn">Cancelar</a>
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar material</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
