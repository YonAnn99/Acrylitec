{% extends 'gestion/base.html' %}

{% block title %}Nuevo cliente — Acrylitec{% endblock %}

{% block content %}
<header class="page-header">
    <div class="page-heading">
        <a class="page-eyebrow" href="{% url 'lista_clientes' %}"><i class="bi bi-chevron-left"></i> Clientes</a>
        <h1 class="page-title">Nuevo cliente</h1>
    </div>
</header>

<section class="card" style="max-width: 680px;">
    <div class="card-body">
        <form method="POST" style="display: flex; flex-direction: column; gap: 16px;">
            {% csrf_token %}
            <div>
                <label class="form-label" for="cliNombre">Nombre del cliente o empresa</label>
                <input type="text" id="cliNombre" name="nombre" class="form-control" placeholder="Ej. Papelería Morales" required autofocus>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px;">
                <div>
                    <label class="form-label" for="cliTelefono">Teléfono</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                        <input type="tel" id="cliTelefono" name="telefono" class="form-control" placeholder="10 dígitos">
                    </div>
                </div>
                <div>
                    <label class="form-label" for="cliEmail">Correo electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="cliEmail" name="email" class="form-control" placeholder="contacto@ejemplo.com">
                    </div>
                </div>
            </div>

            <div>
                <label class="form-label" for="cliDireccion">Dirección de entrega / fiscal</label>
                <textarea id="cliDireccion" name="direccion" class="form-control" rows="3" placeholder="Calle, número, colonia…"></textarea>
            </div>

            <div style="display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;">
                <a href="{% url 'lista_clientes' %}" class="btn">Cancelar</a>
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar cliente</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
