{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Acrylitec — Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'gestion/css/main.css' %}" rel="stylesheet">
</head>

<body class="login-wrapper">
    <div class="login-card">
        <div class="login-logo">
            <img src="{% static 'gestion/img/logo_acrylitec.png' %}" alt="Acrylitec">
            <h1>Acrylitec</h1>
            <p>Sistema de Gestión</p>
        </div>

        {% if form.errors %}
        <div class="alert alert-danger text-center">
            Usuario o contraseña incorrectos.
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" placeholder="Tu usuario" autofocus required>
            </div>
            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn">
                Entrar al sistema
            </button>
        </form>
    </div>
</body>

</html>
